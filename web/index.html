<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FBF7F0" />
  <title>Leave a Review</title>

  <!-- Prevent search engine indexing of review pages -->
  <meta name="robots" content="noindex, nofollow" />

  <!--
    Security: all API calls go through our backend server; no API keys here.
    script-src 'unsafe-inline' is required because all JS is inline in this static file.
    (frame-ancestors only works as an HTTP header, which GitHub Pages can't set.)
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'unsafe-inline';
    style-src 'unsafe-inline';
    connect-src https://merchant-review-app.onrender.com wss://merchant-review-app.onrender.com http://localhost:3000 ws://localhost:3000;
    img-src 'self' data:;
  " />

  <style>
    /* ── Tokens ── */
    :root {
      --paper: #FBF7F0;
      --ink: #1B1A17;
      --muted: #5E584E;
      --faint: #6E675B;
      --marigold: #F2A900;
      --marigold-deep: #8A5E00;
      --marigold-soft: #FBF1D6;
      --green: #1F6E50;
      --green-dark: #16533C;
      --clay: #B8431F;
      --line: #E6DCC8;
      --line-strong: #A89878;
      --star-empty: #8C7B5C;
      --card: #FFFFFF;
      --font: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", "Noto Sans Gujarati", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    :lang(hi) h1, :lang(hi) h2 { letter-spacing: 0 !important; line-height: 1.35 !important; }
    button, a, textarea, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: var(--green); font-weight: 600; text-decoration: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── App frame: scrolling content + fixed bottom bar ── */
    .app { position: relative; height: 100dvh; max-width: 480px; margin: 0 auto; overflow: hidden; }
    .deco-a { position: absolute; width: 280px; height: 280px; border-radius: 50%; background: #F9E7B4; top: -150px; right: -120px; pointer-events: none; }
    .deco-b { position: absolute; width: 140px; height: 140px; border-radius: 50%; border: 2px solid #F2D9A0; top: 72px; right: -40px; pointer-events: none; }
    .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
    .screen.active { display: flex; }
    .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 24px 24px 16px; display: flex; flex-direction: column; position: relative; }
    .bar {
      flex-shrink: 0; position: relative; z-index: 3; display: flex; flex-direction: column; gap: 12px;
      padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
      background: var(--paper); border-top: 1px solid #EFE6D4; box-shadow: 0 -14px 24px -20px rgba(27,26,23,.45);
    }
    .bar .link-private { text-align: center; font-size: 14px; padding: 8px 0; background: none; border: none; color: var(--green); font-weight: 600; }

    /* ── Shared pieces ── */
    .press { transition: transform .14s ease; }
    .press:active { transform: translateY(2px) scale(.97); }
    .btn-primary {
      min-height: 56px; border: none; border-radius: 16px; background: var(--green); color: #FFF;
      font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 12px 24px -14px rgba(31,110,80,.9); padding: 0 16px;
    }
    .btn-primary:disabled { background: var(--line); color: var(--muted); box-shadow: none; cursor: not-allowed; }
    .btn-ghost {
      min-height: 48px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line-strong);
      background: var(--card); font-size: 14px; font-weight: 600;
    }
    .card { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; }
    .muted { color: var(--muted); }
    .label { font-size: 14px; font-weight: 600; color: var(--muted); }

    /* ── Header ── */
    .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .shop { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mono {
      width: 48px; height: 48px; flex-shrink: 0; border-radius: 12px; background: var(--ink); color: var(--marigold);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px;
    }
    .shop-name { font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shop-area { font-size: 13px; color: var(--muted); }
    .lang-btn { flex-shrink: 0; height: 48px; padding: 0 16px; border-radius: 24px; border: 1.5px solid var(--line-strong); background: var(--card); font-size: 14px; font-weight: 600; }

    h1.big { margin-top: 24px; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.8px; }
    .sub { margin-top: 8px; font-size: 16px; color: var(--muted); }

    /* ── Rate screen ── */
    .face-wrap { margin-top: 24px; display: flex; justify-content: center; perspective: 600px; }
    .face {
      width: 112px; height: 112px; border-radius: 50%; background: #F3ECDF;
      box-shadow: inset 0 -8px 0 rgba(27,26,23,.05), 0 16px 26px -18px rgba(27,26,23,.45);
      animation: float 4s ease-in-out 2;
    }
    .face .mouth { transform-origin: 60px 78px; transition: transform .45s cubic-bezier(.34,1.56,.64,1); }
    .mood { margin-top: 12px; text-align: center; font-size: 20px; font-weight: 700; min-height: 30px; }
    .stars { margin-top: 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .star { height: 64px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; transition: transform .12s ease; }
    .star:active { transform: translateY(2px) scale(.9); }
    .star svg { width: 52px; height: 52px; overflow: visible; }
    .star path { fill: #FFFDF8; stroke: var(--star-empty); stroke-width: 1.75; stroke-linejoin: round; }
    .star.on path { fill: var(--marigold); stroke: var(--marigold-deep); }
    .star.pop svg { animation: pop .32s cubic-bezier(.3,1.4,.5,1) both; }
    .scale { display: flex; justify-content: space-between; padding: 0 16px; font-size: 13px; color: var(--muted); }
    .footnote { margin-top: 24px; text-align: center; font-size: 13px; color: var(--muted); }
    .footnote + .footnote { margin-top: 8px; color: var(--faint); }

    .pending { padding: 16px; display: flex; flex-direction: column; gap: 12px; animation: fadeUp .25s ease both; }
    .progress { height: 4px; border-radius: 2px; background: #EFE6D4; overflow: hidden; }
    .progress > div { height: 4px; background: var(--green); transform-origin: 0 50%; animation: prog 1.2s linear both; }
    .pending-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; font-weight: 600; }

    .details-btn {
      min-height: 64px; border-radius: 20px; border: 1.5px solid var(--line-strong); background: var(--card);
      display: flex; align-items: center; gap: 12px; padding: 8px 16px; text-align: left;
    }
    .details-btn .ico { width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: var(--marigold-soft); display: flex; align-items: center; justify-content: center; }
    .details-btn .txt { display: flex; flex-direction: column; flex-grow: 1; }
    .details-btn .t1 { font-size: 16px; font-weight: 700; }
    .details-btn .t2 { font-size: 13px; color: var(--muted); }

    /* ── Details screen ── */
    .top-row { display: flex; align-items: center; justify-content: space-between; }
    .icon-btn { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--card); display: flex; align-items: center; justify-content: center; }
    .stars.small { margin: 0; display: flex; }
    .stars.small .star { width: 48px; height: 48px; }
    .stars.small .star svg { width: 32px; height: 32px; }
    h2.title { margin-top: 24px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
    .mic-btn {
      margin-top: 16px; min-height: 56px; border-radius: 16px; border: none; background: var(--ink); color: var(--paper);
      display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 16px; font-weight: 600;
    }
    .mic-dot { position: relative; width: 32px; height: 32px; border-radius: 50%; background: var(--marigold); display: flex; align-items: center; justify-content: center; }
    .mic-dot::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--marigold); animation: micRing 1.6s ease-out 3; }
    .mic-btn.recording { background: var(--clay); }
    .mic-btn.recording .mic-dot::after { animation: micRing 1.2s ease-out infinite; }
    .live { margin-top: 8px; font-size: 14px; color: var(--muted); min-height: 21px; }
    .draft-card { margin-top: 16px; padding: 16px; }
    .draft-card textarea {
      margin-top: 8px; width: 100%; min-height: 120px; border: none; resize: vertical; background: transparent;
      font-size: 17px; line-height: 1.5; outline: none;
    }
    .draft-card .hint { margin-top: 8px; font-size: 13px; color: var(--muted); }

    /* ── Copied screen ── */
    .status { display: flex; align-items: center; gap: 16px; }
    .status-ico { width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .status-ico.ok { background: var(--green); animation: scaleIn .4s cubic-bezier(.34,1.56,.64,1) both; }
    .status-ico.ok path { stroke-dasharray: 26; animation: check .45s .2s ease both; }
    .status-ico.fail { background: #FDF1D2; border: 2px solid #E2B44A; }
    .status h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1; }
    .inapp { margin-bottom: 16px; padding: 12px 16px; border-radius: 16px; background: #FDF1D2; border: 1.5px solid #E2B44A; display: flex; align-items: center; gap: 12px; }
    .inapp p { font-size: 14px; flex-grow: 1; }
    .inapp a { min-height: 48px; padding: 0 14px; border-radius: 12px; background: var(--ink); color: var(--paper); display: flex; align-items: center; flex-shrink: 0; font-size: 14px; }

    .printer { margin-top: 24px; }
    .slot { height: 10px; margin: 0 -4px; border-radius: 6px; background: var(--ink); position: relative; z-index: 2; }
    .feed { overflow: hidden; margin-top: -4px; padding: 0 8px; }
    .receipt { position: relative; background: var(--card); box-shadow: 0 24px 40px -28px rgba(27,26,23,.55); animation: print .75s steps(4, end) .15s both; }
    .receipt-body { padding: 20px 20px 12px; }
    .meta { display: flex; justify-content: space-between; gap: 8px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
    .r-stars { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .r-stars svg { width: 18px; height: 18px; }
    .quote { margin-top: 12px; font-size: 20px; line-height: 1.4; font-weight: 500; user-select: all; -webkit-user-select: all; }
    .quote.fail { padding: 8px; border: 2px dashed #E2B44A; border-radius: 8px; background: #FFFBEF; }
    .hold-hint { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--marigold-deep); }
    .stamp {
      margin-left: auto; padding: 4px 10px; border: 2.5px solid #D9A21B; border-radius: 8px; white-space: nowrap;
      color: #B07F00; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 1px;
      transform: rotate(-6deg); animation: stamp .45s cubic-bezier(.3,1.4,.5,1) .95s both; pointer-events: none;
    }
    .tear { position: relative; height: 16px; }
    .tear::after { content: ''; position: absolute; left: 0; right: 0; top: 7px; border-top: 2px dashed #E0D5BF; }
    .receipt-foot { padding: 4px 20px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); }
    .zigzag {
      height: 12px;
      background: linear-gradient(-45deg, var(--paper) 6px, transparent 0), linear-gradient(45deg, var(--paper) 6px, transparent 0);
      background-size: 12px 12px; background-repeat: repeat-x; background-position: left bottom;
    }
    .posting { margin-top: 16px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; animation: fadeUp .35s 1s ease both; }
    .posting .p1 { font-size: 13px; color: var(--muted); }
    .posting .p2 { font-size: 15px; font-weight: 700; }
    .steps { margin-top: 8px; list-style: none; display: flex; flex-direction: column; gap: 8px; animation: fadeUp .35s 1.1s ease both; }
    .steps li { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.4; }
    .steps .n { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
    .not-opened { text-align: center; font-size: 14px; font-weight: 600; color: var(--marigold-deep); }

    /* ── Thanks screen ── */
    .thanks { align-items: center; text-align: center; }
    .burst { position: relative; margin-top: 120px; width: 112px; height: 112px; }
    .petal { position: absolute; left: 48px; top: 51px; width: 16px; height: 10px; border-radius: 10px 10px 10px 0; animation: petal 1.3s cubic-bezier(.2,.8,.3,1) both; }
    .heart { position: absolute; inset: 0; border-radius: 50%; background: var(--marigold); display: flex; align-items: center; justify-content: center; animation: scaleIn .5s cubic-bezier(.34,1.56,.64,1) both; box-shadow: 0 18px 30px -20px rgba(138,94,0,.9); }
    .thanks h1 { margin-top: 32px; font-size: 40px; font-weight: 800; animation: fadeUp .45s .2s ease both; }
    .thanks p { margin-top: 8px; max-width: 300px; color: var(--muted); animation: fadeUp .45s .3s ease both; }
    .again-card { padding: 16px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
    .again-card h2 { font-size: 16px; font-weight: 700; }

    /* ── Private feedback sheet ── */
    .sheet-bg { position: fixed; inset: 0; background: rgba(27,26,23,.45); display: none; z-index: 10; }
    .sheet-bg.open { display: block; }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; max-height: 92dvh; overflow-y: auto;
      background: var(--paper); border-radius: 24px 24px 0 0; padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 12px; animation: sheetUp .25s ease both;
    }
    .sheet h2 { font-size: 22px; font-weight: 800; }
    .sheet textarea, .sheet input { width: 100%; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--card); padding: 12px; font-size: 16px; }
    .sheet textarea { min-height: 120px; resize: vertical; }
    .sheet .row { display: flex; gap: 12px; }
    .sheet .row > * { flex: 1; }
    .error-banner { margin-top: 16px; padding: 16px; border-radius: 16px; background: #FDF1D2; border: 1.5px solid #E2B44A; font-size: 14px; display: none; }
    .error-banner.show { display: block; }

    /* ── Short phones ── */
    @media (max-height: 700px) {
      h1.big { font-size: 30px; }
      .face { width: 72px; height: 72px; }
      .face svg { width: 72px; height: 72px; }
    }

    /* ── Motion ── */
    @keyframes float { 0%,100% { transform: translateY(0) rotateY(-8deg) rotateX(5deg); } 50% { transform: translateY(-8px) rotateY(8deg) rotateX(-3deg); } }
    @keyframes pop { 0% { transform: scale(.6) rotate(-18deg); } 60% { transform: scale(1.2) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes prog { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes print { from { transform: translateY(-100%); } to { transform: translateY(0); } }
    @keyframes stamp { 0% { opacity: 0; transform: rotate(-6deg) scale(1.8); } 70% { opacity: 1; transform: rotate(-6deg) scale(.94); } 100% { opacity: 1; transform: rotate(-6deg) scale(1); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes check { from { stroke-dashoffset: 26; } to { stroke-dashoffset: 0; } }
    @keyframes scaleIn { 0% { transform: scale(0); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
    @keyframes petal { 0% { opacity: 0; transform: translate(0,0) rotate(0) scale(.3); } 12% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(280deg) scale(1); } }
    @keyframes micRing { from { transform: scale(1); opacity: .6; } to { transform: scale(1.7); opacity: 0; } }
    @keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="deco-a" aria-hidden="true"></div>
  <div class="deco-b" aria-hidden="true"></div>
  <div class="sr-only" aria-live="polite" id="announce"></div>

  <!-- ═══ Rate ═══ -->
  <section class="screen active" id="screenRate" aria-labelledby="rateTitle">
    <div class="scroll">
      <div class="head">
        <div class="shop">
          <div class="mono" id="mono" aria-hidden="true">·</div>
          <div style="min-width:0">
            <div class="shop-name" id="shopName"></div>
            <div class="shop-area" id="shopArea"></div>
          </div>
        </div>
        <button class="lang-btn press" id="langBtn" type="button" aria-label="Language: English, हिंदी">English · हिंदी</button>
      </div>

      <h1 class="big" id="rateTitle" tabindex="-1" data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>

      <div class="face-wrap" aria-hidden="true">
        <div class="face">
          <svg width="112" height="112" viewBox="0 0 120 120">
            <circle cx="44" cy="52" r="6" fill="#1B1A17"></circle>
            <circle cx="76" cy="52" r="6" fill="#1B1A17"></circle>
            <circle cx="46" cy="50" r="1.8" fill="#FFF"></circle>
            <circle cx="78" cy="50" r="1.8" fill="#FFF"></circle>
            <path class="mouth" id="mouth" d="M38 74 Q60 92 82 74" fill="none" stroke="#1B1A17" stroke-width="5" stroke-linecap="round" style="transform: scaleY(0.15)"></path>
          </svg>
        </div>
      </div>
      <div class="mood" id="mood"></div>

      <div class="stars" role="radiogroup" id="starsBig"></div>
      <div class="scale"><span data-t="low"></span><span data-t="high"></span></div>

      <div class="error-banner" id="loadError" role="alert"></div>

      <p class="footnote" data-t="honest"></p>
      <p class="footnote">ReviewReach</p>
    </div>
    <div class="bar">
      <div class="card pending" id="pending" hidden>
        <div class="progress"><div id="progBar"></div></div>
        <div class="pending-row">
          <span id="pendingText"></span>
          <button class="btn-ghost press" id="stayBtn" type="button" data-t="stay"></button>
        </div>
      </div>
      <button class="btn-primary press" id="continueBtn" type="button" hidden data-t="continue"></button>
      <button class="details-btn press" id="detailsBtn" type="button">
        <span class="ico" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A5E00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
        </span>
        <span class="txt"><span class="t1" data-t="detailsCard"></span><span class="t2" data-t="detailsSub"></span></span>
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button class="link-private" type="button" data-private data-t="private"></button>
    </div>
  </section>

  <!-- ═══ Details (own words / voice) ═══ -->
  <section class="screen" id="screenDetails" aria-labelledby="detailsTitle">
    <div class="scroll">
      <div class="top-row">
        <button class="icon-btn press" id="backBtn" type="button" data-t-label="back">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg>
        </button>
        <div class="stars small" role="radiogroup" id="starsSmall"></div>
      </div>
      <h2 class="title" id="detailsTitle" tabindex="-1" data-t="detailsTitle"></h2>
      <p class="sub" style="font-size:14px" data-t="detailsLead"></p>

      <button class="mic-btn press" id="micBtn" type="button">
        <span class="mic-dot" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1B1A17" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        </span>
        <span id="micLabel"></span>
      </button>
      <div class="live" id="liveText" aria-live="polite"></div>

      <div class="card draft-card">
        <label class="label" for="draftText" id="draftLabel"></label>
        <textarea id="draftText" spellcheck="true"></textarea>
        <p class="hint" data-t="draftNote"></p>
      </div>
    </div>
    <div class="bar">
      <button class="btn-primary press" id="copyOpenBtn" type="button"></button>
      <button class="link-private" type="button" data-private data-t="private"></button>
    </div>
  </section>

  <!-- ═══ Copied ═══ -->
  <section class="screen" id="screenCopied" aria-labelledby="copiedTitle">
    <div class="scroll">
      <div class="inapp" id="inappBanner" hidden>

(function () {

      speak: 'बोलकर बताइए', stopRec: 'रिकॉर्डिंग रोकें', listening: 'सुन रहे हैं…', tidying: 'आपके शब्द साफ़ कर रहे हैं…',
      draftLabel: 'आपका रिव्यू', draftNote: 'Google पर भी आप कुछ भी बदल सकते हैं।',

      copied: 'रिव्यू कॉपी हो गया', copiedSub: 'अब इसे Google पर पोस्ट करें',

      edit: 'बदलें',
      postingTo: 'यहाँ पोस्ट होगा',
      placeStats: function (r, c) { return r + ' ★ · Google पर ' + c + ' रिव्यू'; },
      onGoogle: 'Google पर',
      step1: function (n) { return 'फिर से ' + n + ' स्टार दबाइए'; },

      inAppBtn: 'ब्राउज़र में खोलें',
      thanks: 'धन्यवाद',
      thanksSub: function (n) { return 'आपका रिव्यू ' + n + ' और अगले ग्राहक की मदद करता है।'; },
      notPosted: 'अभी पोस्ट नहीं किया?', again: 'फिर से कॉपी करें और Google खोलें',
      sheetTitle: 'मालिक को संदेश', sheetLead: 'यह सिर्फ़ मालिक को जाता है और Google पर नहीं दिखता। आप Google रिव्यू भी पोस्ट कर सकते हैं।',
      fbMessage: 'आपका संदेश', fbPhone: 'फ़ोन (ज़रूरी नहीं)', fbEmail: 'ईमेल (ज़रूरी नहीं)',
      fbSend: 'मालिक को भेजें', fbSending: 'भेज रहे हैं…', fbDone: 'भेज दिया। बताने के लिए धन्यवाद।', fbEmpty: 'पहले संदेश लिखिए।',
      close: 'बंद करें',
      loadError: 'दुकान लोड नहीं हो सकी। इंटरनेट देखें और पेज फिर से खोलें।',
      badLink: 'यह लिंक अधूरा है। कृपया QR कोड फिर से स्कैन करें।',
      fallback: [
        '', '{n} में अनुभव निराशाजनक रहा।', '{n} में अनुभव ज़्यादा अच्छा नहीं रहा।', '{n} में अनुभव ठीक-ठाक रहा।',
        '{n} में अच्छा अनुभव रहा।', '{n} में बहुत अच्छा अनुभव रहा।'
      ],
      thisShop: 'यह दुकान'
    }
  };

  // ─────────────────────────────────────────────
  //  Link parameters
  // ─────────────────────────────────────────────
  var q = new URLSearchParams(location.search);
  function decodeParam(v) { try { return v ? decodeURIComponent(v) : ''; } catch (e) { return v || ''; } }
  function cleanText(s, maxLen) { return (s || '').replace(/[\r\n\x00<>]/g, ' ').trim().slice(0, maxLen || 200); }

  var rawPlaceId = decodeParam(q.get('pid'));
  var PLACE_ID = /^[a-zA-Z0-9_\-:]{10,200}$/.test(rawPlaceId) ? rawPlaceId : '';
  var rawUid = decodeParam(q.get('uid'));
  var UID = /^[a-zA-Z0-9_\-]{1,128}$/.test(rawUid) ? rawUid : '';

  // Origin params — strip immediately so a refresh doesn't count again
  var IS_QR_SCAN = q.get('QrOrigin') === 'true';
  var IS_LINK_VISIT = q.get('LinkOrigin') === 'true';
  if (IS_QR_SCAN || IS_LINK_VISIT) {
    try {
      var cleanUrl = location.pathname + (PLACE_ID ? '?pid=' + encodeURIComponent(PLACE_ID) : '');
      if (UID) cleanUrl += '&uid=' + encodeURIComponent(UID);
      history.replaceState(null, '', cleanUrl);
    } catch (e) { /* ignore */ }
  }

  // ─────────────────────────────────────────────
  //  State
  // ─────────────────────────────────────────────
  var state = {
    lang: /^hi\b/i.test(navigator.language || '') ? 'hi' : 'en',
    screen: 'rate',
    rating: 0,
    prevRating: 0,
    drafts: null,          // [1★..5★] from the server, per language
    text: '',              // what gets copied
    ownWords: false,       // true when the text came from typing/voice
    copyOk: true,
    shopName: '',
    area: '',
    place: null,
    leftForGoogle: false
  };
  var SESSION_TOKEN = '';
  var advanceTimer = null;

  function t() { return T[state.lang]; }
  function $(id) { return document.getElementById(id); }
  function shopName() { return state.shopName || t().thisShop; }
  function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* ignore */ } }
  function announce(msg) { $('announce').textContent = msg; }

  // ─────────────────────────────────────────────
  //  API
  // ─────────────────────────────────────────────
  function apiHeaders() {
    return { 'Content-Type': 'application/json', 'X-Session-Token': SESSION_TOKEN };
  }

  async function startSession() {
    var res = await fetch(API_BASE + '/api/v1/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: UID, placeId: PLACE_ID })
    });
    var json = await res.json().catch(function () { return {}; });
    if (!res.ok || !json.success || !json.data) throw new Error(json.error || ('HTTP ' + res.status));
    SESSION_TOKEN = json.data.token;
    return json.data;
  }

  function postAnalytics(event) {
    if (!SESSION_TOKEN) return;
    fetch(API_BASE + '/api/v1/merchants/' + encodeURIComponent(UID) + '/branches/' + encodeURIComponent(PLACE_ID) + '/analytics', {
      method: 'POST', headers: apiHeaders(), body: JSON.stringify({ event: event })
    }).catch(function () { /* best-effort */ });
  }

  async function fetchPlace() {
    try {
      var res = await fetch(API_BASE + '/api/v1/places/' + encodeURIComponent(PLACE_ID), { headers: { 'X-Session-Token': SESSION_TOKEN } });
      var json = await res.json();
      return json.success ? json.data : null;
    } catch (e) { return null; }
  }

  var draftsByLang = {};
  async function loadDrafts(lang) {
    if (draftsByLang[lang]) return draftsByLang[lang];
    try {
      var res = await fetch(API_BASE + '/api/v1/review/drafts?lang=' + encodeURIComponent(lang), { headers: { 'X-Session-Token': SESSION_TOKEN } });
      var json = await res.json();
      if (json.success && json.data && json.data.drafts && json.data.drafts.length === 5) {
        draftsByLang[lang] = json.data.drafts;
        return json.data.drafts;
      }
    } catch (e) { /* fall back below */ }
    return null;
  }

  /** Draft for a rating: server draft, else a plain local sentence. */
  function draftFor(rating) {
    var d = draftsByLang[state.lang];
    if (d && d[rating - 1]) return d[rating - 1];
    return t().fallback[rating].replace('{n}', shopName());
  }

  // ─────────────────────────────────────────────
  //  Clipboard — called inside the tap handler
  // ─────────────────────────────────────────────
  function legacyCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  /** Starts the copy immediately (within the user gesture) and reports success. */
  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }

  // ─────────────────────────────────────────────
  //  In-app browser detection
  // ─────────────────────────────────────────────
  var UA = navigator.userAgent || '';
  var IS_IN_APP = /FBAN|FBAV|Instagram|Line\/|; wv\)|PhonePe|Paytm/i.test(UA);
  var IS_ANDROID = /Android/i.test(UA);

  // ─────────────────────────────────────────────
  //  Rendering
  // ─────────────────────────────────────────────
  var STAR_PATH = 'M12 2.6l2.85 5.9 6.5.92-4.72 4.55 1.13 6.43L12 17.36l-5.76 3.04 1.13-6.43L2.65 9.42l6.5-.92z';
  var MOUTH = [0.15, -1, -0.5, 0.05, 0.6, 1];

  function buildStars(containerId) {
    var c = $(containerId);
    c.innerHTML = '';
    for (var n = 1; n <= 5; n++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'star';
      b.setAttribute('role', 'radio');
      b.dataset.n = String(n);
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + STAR_PATH + '"></path></svg>';
      b.addEventListener('click', onStarTap);
      c.appendChild(b);
    }
  }

  function renderStars(tapped) {
    ['starsBig', 'starsSmall'].forEach(function (id) {
      var c = $(id);
      c.setAttribute('aria-label', t().rateGroup(shopName()));
      Array.prototype.forEach.call(c.children, function (b) {
        var n = Number(b.dataset.n);
        var on = n <= state.rating;
        b.classList.toggle('on', on);
        b.setAttribute('aria-checked', n === state.rating ? 'true' : 'false');
        b.setAttribute('aria-label', t().star(n));
        // Pop the tapped star at once; neighbours ripple 35ms apart
        var animate = tapped && on && (n > state.prevRating || n === tapped);
        b.classList.remove('pop');
        if (animate) {
          b.querySelector('svg').style.animationDelay = (Math.abs(tapped - n) * 35) + 'ms';
          void b.offsetWidth;
          b.classList.add('pop');
        }
      });
    });
    $('mouth').style.transform = 'scaleY(' + MOUTH[state.rating] + ')';
    $('mood').textContent = t().moods[state.rating];
  }

  function applyText() {
    var L = t();
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-t]').forEach(function (el) {
      var v = L[el.getAttribute('data-t')];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('[data-t-label]').forEach(function (el) {
      el.setAttribute('aria-label', L[el.getAttribute('data-t-label')]);
    });
    $('langBtn').textContent = L.langBtn;
    $('micLabel').textContent = recording ? L.stopRec : L.speak;
    $('draftLabel').textContent = L.draftLabel;
    $('thanksSub').textContent = L.thanksSub(shopName());
    renderStars(0);
    renderCopyButton();
    if (state.screen === 'copied') renderCopied();
  }

  function renderShop() {
    var name = shopName();
    $('shopName').textContent = name;
    $('mono').textContent = initials(state.shopName);
    $('shopArea').textContent = state.area;
    document.title = 'Review — ' + name;
  }

  function initials(name) {
    var parts = (name || '').replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return '★';
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  function showScreen(name) {
    state.screen = name;
    var ids = { rate: 'screenRate', details: 'screenDetails', copied: 'screenCopied', thanks: 'screenThanks' };
    Object.keys(ids).forEach(function (k) { $(ids[k]).classList.toggle('active', k === name); });
    var heading = { rate: 'rateTitle', details: 'detailsTitle', copied: 'copiedTitle', thanks: 'thanksTitle' }[name];
    // Move focus to the new screen's heading for screen readers
    setTimeout(function () { var h = $(heading); if (h) h.focus({ preventScroll: true }); }, 50);
  }

  // ─────────────────────────────────────────────
  //  Rate screen
  // ─────────────────────────────────────────────
  function onStarTap(e) {
    var n = Number(e.currentTarget.dataset.n);
    buzz(8);
    state.prevRating = state.rating;
    state.rating = n;
    renderStars(n);

    if (state.screen === 'details') {
      // On the details screen a star only changes the rating
      if (!state.ownWords) $('draftText').value = draftFor(n);
      renderCopyButton();
      return;
    }

    // Copy now, inside the tap, then move on after 1.2 s unless they stay
    state.text = draftFor(n);
    state.ownWords = false;
    clearTimeout(advanceTimer);
    $('continueBtn').hidden = true;
    $('pending').hidden = false;
    var bar = $('progBar');
    bar.style.animation = 'none';
    void bar.offsetWidth;
    bar.style.animation = '';
    copyText(state.text, function (ok) {
      state.copyOk = ok;
      $('pendingText').textContent = ok ? t().copiedNext : t().notCopiedNext;
    });
    advanceTimer = setTimeout(goCopied, 1200);
  }

  $('stayBtn').addEventListener('click', function () {
    clearTimeout(advanceTimer);
    $('pending').hidden = true;
    $('continueBtn').hidden = false;
  });
  $('continueBtn').addEventListener('click', function () {
    copyText(state.text, function (ok) { state.copyOk = ok; goCopied(); });
  });

  function goCopied() {
    clearTimeout(advanceTimer);
    $('pending').hidden = true;
    $('continueBtn').hidden = !state.rating;
    buzz(state.copyOk ? [10, 40, 18] : 8);
    renderCopied();
    showScreen('copied');
    announce(state.copyOk ? t().copied + '. ' + t().copiedSub : t().notCopied);
  }

  // ─────────────────────────────────────────────
  //  Details screen (own words / voice)
  // ─────────────────────────────────────────────
  $('detailsBtn').addEventListener('click', function () {
    clearTimeout(advanceTimer);
    $('pending').hidden = true;
    $('continueBtn').hidden = !state.rating;
    if (!$('draftText').value.trim() && state.rating) $('draftText').value = draftFor(state.rating);
    renderCopyButton();
    showScreen('details');
  });
  $('backBtn').addEventListener('click', function () {
    if (recording) stopRecording();
    showScreen('rate');
  });
  $('draftText').addEventListener('input', function () {
    state.ownWords = true;
    renderCopyButton();
  });

  function renderCopyButton() {
    var btn = $('copyOpenBtn');
    var hasText = !!$('draftText').value.trim();
    btn.disabled = !state.rating || !hasText;
    btn.textContent = !state.rating ? t().pickFirst : !hasText ? t().writeFirst : t().copyOpen;
  }

  $('copyOpenBtn').addEventListener('click', function () {
    var text = $('draftText').value.trim();
    if (!state.rating || !text) return;
    state.text = text;
    copyText(text, function (ok) {
      state.copyOk = ok;
      goCopied();
    });
  });

  // ─────────────────────────────────────────────
  //  Copied screen
  // ─────────────────────────────────────────────
  function renderCopied() {
    var L = t();
    var ok = state.copyOk;
    $('icoOk').hidden = !ok;
    $('icoFail').hidden = ok;
    $('copiedTitle').textContent = ok ? L.copied : L.notCopied;
    $('copiedSub').textContent = ok ? L.copiedSub : L.notCopiedSub;
    $('holdHint').hidden = ok;
    $('quote').classList.toggle('fail', !ok);
    $('quote').textContent = '“' + state.text + '”';
    $('metaShop').textContent = shopName().toUpperCase().slice(0, 28);
    var now = new Date();
    $('metaTime').textContent = now.toLocaleDateString(state.lang === 'hi' ? 'hi-IN' : 'en-IN', { day: '2-digit', month: 'short' }) +
      ' · ' + now.toLocaleTimeString(state.lang === 'hi' ? 'hi-IN' : 'en-IN', { hour: '2-digit', minute: '2-digit' });
    var stars = '';
    for (var n = 1; n <= 5; n++) {
      stars += '<svg viewBox="0 0 24 24"><path d="' + STAR_PATH + '" fill="' + (n <= state.rating ? '#F2A900' : '#FFFDF8') +
        '" stroke="' + (n <= state.rating ? '#8A5E00' : '#8C7B5C') + '" stroke-width="1.75" stroke-linejoin="round"></path></svg>';
    }
    $('rStars').innerHTML = stars;
    $('rStarsText').textContent = L.starsText(state.rating);
    $('receiptLabel').textContent = state.ownWords ? L.receiptOwn : L.receiptLabel;
    $('step1').textContent = L.step1(state.rating);

    if (state.place && state.place.rating && state.place.userRatingCount) {
      $('postingCard').hidden = false;
      $('postingName').textContent = shopName() + (state.area ? ' · ' + state.area : '');
      $('postingStats').textContent = L.placeStats(state.place.rating.toFixed(1), state.place.userRatingCount.toLocaleString('en-IN'));
    } else {
      $('postingCard').hidden = true;
    }

    $('inappBanner').hidden = !IS_IN_APP;
    if (IS_IN_APP) {
      $('inappLink').href = IS_ANDROID
        ? 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end'
        : location.href;
    }

    // Restart the print animation
    var r = $('receipt');
    r.style.animation = 'none';
    void r.offsetWidth;
    r.style.animation = '';
  }

  $('editBtn').addEventListener('click', function () {
    $('draftText').value = state.text;
    renderCopyButton();
    showScreen('details');
  });

  function googleReviewUrl() {
    return 'https://search.google.com/local/writereview?placeid=' + encodeURIComponent(PLACE_ID);
  }

  $('openGoogleBtn').addEventListener('click', function () {
    buzz(8);
    postAnalytics('review_copied');
    state.leftForGoogle = true;
    // Remember where we were, in case the browser reloads this page on return
    try { sessionStorage.setItem('rr_left', JSON.stringify({ text: state.text, rating: state.rating, lang: state.lang })); } catch (e) { /* ignore */ }
    $('notOpened').hidden = true;
    // If we are still visible after 1.5 s, Google probably didn't open
    setTimeout(function () {
      if (document.visibilityState === 'visible' && state.screen === 'copied') $('notOpened').hidden = false;
    }, 1500);
    location.href = googleReviewUrl();
  });

  // Show "Thank you" only after the customer actually comes back from Google
  var wasHidden = false;
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden' && state.leftForGoogle) wasHidden = true;
    if (document.visibilityState === 'visible' && wasHidden) {
      wasHidden = false;
      state.leftForGoogle = false;
      showThanks();
    }
  });
  window.addEventListener('pageshow', function (e) {
    if (e.persisted && state.leftForGoogle) { state.leftForGoogle = false; showThanks(); }
  });

  // ─────────────────────────────────────────────
  //  Thanks screen
  // ─────────────────────────────────────────────
  function showThanks() {
    var burst = $('burst');
    burst.querySelectorAll('.petal').forEach(function (p) { p.remove(); });
    var colors = ['#F2A900', '#F9D56E', '#1F6E50'];
    for (var i = 0; i < 14; i++) {
      var a = (i / 14) * Math.PI * 2, r = 100 + (i % 3) * 28;
      var p = document.createElement('span');
      p.className = 'petal';
      p.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px');
      p.style.setProperty('--dy', Math.round(Math.sin(a) * r) + 'px');
      p.style.background = colors[i % 3];
      p.style.animationDelay = (i * 25) + 'ms';
      burst.insertBefore(p, burst.firstChild);
    }
    $('thanksSub').textContent = t().thanksSub(shopName());
    showScreen('thanks');
    announce(t().thanks);
  }

  $('againBtn').addEventListener('click', function () {
    copyText(state.text, function (ok) { state.copyOk = ok; goCopied(); });
  });

  // ─────────────────────────────────────────────
  //  Language
  // ─────────────────────────────────────────────
  $('langBtn').addEventListener('click', function () {
    state.lang = state.lang === 'en' ? 'hi' : 'en';
    applyText();
    if (SESSION_TOKEN) loadDrafts(state.lang);
  });

  // ─────────────────────────────────────────────
  //  Private feedback sheet
  // ─────────────────────────────────────────────
  var lastFocus = null;
  document.querySelectorAll('[data-private]').forEach(function (b) {
    b.addEventListener('click', function () {
      lastFocus = b;
      $('sheetBg').classList.add('open');
      setTimeout(function () { $('fbComment').focus(); }, 50);
    });
  });
  function closeSheet() {
    $('sheetBg').classList.remove('open');
    if (lastFocus) lastFocus.focus();
  }
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheetBg').addEventListener('click', function (e) { if (e.target === $('sheetBg')) closeSheet(); });

  $('fbSend').addEventListener('click', function () {
    var comment = $('fbComment').value.trim();
    if (!comment) { $('fbComment').focus(); announce(t().fbEmpty); return; }
    var body = { rating: state.rating || 0, comment: comment.slice(0, 2000) };
    var phone = $('fbPhone').value.trim();
    var email = $('fbEmail').value.trim();
    if (phone) body.phone = phone.slice(0, 20);
    if (email) body.email = email.slice(0, 254);
    var btn = $('fbSend');
    btn.disabled = true;
    btn.textContent = t().fbSending;
    fetch(API_BASE + '/api/v1/merchants/' + encodeURIComponent(UID) + '/branches/' + encodeURIComponent(PLACE_ID) + '/feedback', {
      method: 'POST', headers: apiHeaders(), body: JSON.stringify(body)
    }).catch(function () { /* show the same confirmation */ }).then(function () {
      $('sheetForm').hidden = true;
      $('fbDone').hidden = false;
      announce(t().fbDone);
    });
  });

  // ─────────────────────────────────────────────
  //  Voice (WebSocket → Deepgram, then server clean-up)
  // ─────────────────────────────────────────────
  var recording = false;
  var voiceWs = null;
  var mediaRecorder = null;
  var finalParts = [];
  var interim = '';
  var detectedLang = '';

  function wsBase() {
    return (API_BASE.indexOf('https') === 0 ? 'wss' : 'ws') + API_BASE.replace(/^https?/, '');
  }

  function renderLive() {
    var text = finalParts.join(' ') + (interim ? ' ' + interim : '');
    $('liveText').textContent = text.trim() || t().listening;
  }

  function startRecording() {
    if (!SESSION_TOKEN) return;
    finalParts = []; interim = ''; detectedLang = '';
    recording = true;
    $('micBtn').classList.add('recording');
    $('micLabel').textContent = t().stopRec;
    $('liveText').textContent = t().listening;
    var spoken = state.lang === 'hi' ? 'hi' : 'multi';
    voiceWs = new WebSocket(wsBase() + '/api/v1/voice-stream?lang=' + spoken + '&session=' + encodeURIComponent(SESSION_TOKEN));
    voiceWs.onmessage = function (e) {
      try {
        var msg = JSON.parse(e.data);
        if (msg.type === 'ready') startMic();
        else if (msg.type === 'transcript') {
          if (msg.detected_language) detectedLang = msg.detected_language;
          if (msg.is_final) { if (msg.transcript) finalParts.push(msg.transcript); interim = ''; }
          else interim = msg.transcript || '';
          renderLive();
        } else if (msg.type === 'error') {
          stopRecording();
        }
      } catch (err) { /* ignore */ }
    };
    voiceWs.onerror = function () { if (recording) stopRecording(); };
    voiceWs.onclose = function () { if (recording) stopRecording(); };
  }

  function startMic() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      var mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
        : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
      mediaRecorder.ondataavailable = function (e) {
        if (e.data.size > 0 && voiceWs && voiceWs.readyState === WebSocket.OPEN) voiceWs.send(e.data);
      };
      mediaRecorder.start(250);
    }).catch(function () {
      stopRecording();
      $('liveText').textContent = '';
    });
  }

  function stopRecording() {
    recording = false;
    $('micBtn').classList.remove('recording');
    $('micLabel').textContent = t().speak;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      mediaRecorder.stream.getTracks().forEach(function (tr) { tr.stop(); });
    }
    mediaRecorder = null;
    if (voiceWs && voiceWs.readyState === WebSocket.OPEN) {
      voiceWs.send(JSON.stringify({ type: 'finalize' }));
      setTimeout(function () { if (voiceWs) { voiceWs.close(); voiceWs = null; } tidyTranscript(); }, 1200);
    } else {
      voiceWs = null;
      tidyTranscript();
    }
  }

  function tidyTranscript() {
    var transcript = finalParts.join(' ').trim();
    if (!transcript) { $('liveText').textContent = ''; return; }
    $('liveText').textContent = t().tidying;
    var body = { mode: 'voice', transcript: transcript.slice(0, 1000), lang: detectedLang || state.lang };
    if (state.rating) body.stars = state.rating;
    fetch(API_BASE + '/api/v1/review/generate', { method: 'POST', headers: apiHeaders(), body: JSON.stringify(body) })
      .then(function (res) { return res.json(); })
      .then(function (json) { setOwnWords(json.success && json.data && json.data.text ? json.data.text : transcript); })
      .catch(function () { setOwnWords(transcript); });
  }

  function setOwnWords(text) {
    $('liveText').textContent = '';
    $('draftText').value = text;
    state.ownWords = true;
    renderCopyButton();
  }

  $('micBtn').addEventListener('click', function () {
    if (recording) stopRecording(); else startRecording();
  });

  // ─────────────────────────────────────────────
  //  Init
  // ─────────────────────────────────────────────
  buildStars('starsBig');
  buildStars('starsSmall');

  // Back from Google after a full reload: go straight to "Thank you"
  var returning = null;
  try {
    returning = JSON.parse(sessionStorage.getItem('rr_left') || 'null');
    sessionStorage.removeItem('rr_left');
  } catch (e) { returning = null; }
  if (returning && returning.text && returning.rating >= 1 && returning.rating <= 5) {
    state.text = String(returning.text).slice(0, 2000);
    state.rating = returning.rating;
    if (returning.lang === 'hi' || returning.lang === 'en') state.lang = returning.lang;
  }

  renderShop();
  applyText();
  if (returning && state.rating) showThanks();

  (async function init() {
    if (!UID || !PLACE_ID) {
      $('loadError').textContent = t().badLink;
      $('loadError').classList.add('show');
      return;
    }
    var session;
    try {
      session = await startSession();
    } catch (e) {
      $('loadError').textContent = t().loadError;
      $('loadError').classList.add('show');
      return;
    }
    if (session.businessName) state.shopName = cleanText(session.businessName, 100);
    renderShop();
    applyText();

    if (IS_QR_SCAN) postAnalytics('qr_scan');
    if (IS_LINK_VISIT) postAnalytics('link_visit');

    var results = await Promise.all([fetchPlace(), loadDrafts(state.lang)]);
    var place = results[0];
    if (place) {
      state.place = place;
      if (place.displayName && place.displayName.text) state.shopName = cleanText(place.displayName.text, 100);
      var addr = place.shortFormattedAddress || place.formattedAddress || '';
      var parts = addr.split(',').map(function (p) { return p.trim(); })
        .filter(function (p) { return p && !/^[0-9]+$/.test(p) && !/^india$/i.test(p); });
      state.area = cleanText(parts.slice(-2).join(', '), 80);
      renderShop();
      applyText();
    }
  })();
}());
</script>
</body>
</html>
